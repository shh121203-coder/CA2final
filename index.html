<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >
  <meta name="theme-color" content="#142d2a">
  <meta
    name="description"
    content="식물 재배와 생명공학 연구를 수행하는 픽셀 아트 교육 RPG"
  >

  <title>BIO LAB</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main id="app">

    <!-- 시작 화면 -->
    <section
      id="start-screen"
      class="screen active"
      aria-label="게임 시작"
    >
      <div class="start-card pixel-panel">

        <div class="logo-mark" aria-hidden="true">
          <span class="helix h1"></span>
          <span class="helix h2"></span>
        </div>

        <h1>BIO LAB</h1>
        <p class="start-copy">연구원 등록</p>

        <label class="field-label" for="player-name">
          이름
        </label>

        <input
          id="player-name"
          maxlength="10"
          value="새봄"
          autocomplete="off"
        >

        <p class="field-label">전공 선택</p>

        <div id="role-options" class="role-options">

          <button
            class="role-card selected"
            data-role="botanist"
            type="button"
          >
            <span
              class="role-sprite botanist"
              aria-hidden="true"
            ></span>

            <strong>식물 연구원</strong>
            <small>재배 성장 +10%</small>
          </button>

          <button
            class="role-card"
            data-role="molecular"
            type="button"
          >
            <span
              class="role-sprite molecular"
              aria-hidden="true"
            ></span>

            <strong>분자 연구원</strong>
            <small>퀴즈 RP +10%</small>
          </button>

          <button
            class="role-card"
            data-role="engineer"
            type="button"
          >
            <span
              class="role-sprite engineer"
              aria-hidden="true"
            ></span>

            <strong>바이오 엔지니어</strong>
            <small>장비 가격 -10%</small>
          </button>

        </div>

        <button
          id="start-btn"
          class="pixel-button primary big"
          type="button"
        >
          연구소 입장
        </button>

        <button
          id="continue-btn"
          class="pixel-button hidden"
          type="button"
        >
          저장 기록 이어하기
        </button>

      </div>
    </section>

    <!-- 게임 화면 -->
    <section
      id="game-screen"
      class="screen"
      aria-label="BIO LAB 게임"
    >

      <!-- 상단 정보창 -->
      <header id="hud" class="pixel-panel">

        <div class="hud-group brand">
          <strong>BIO LAB</strong>
          <span id="zone-name">중앙 광장</span>
        </div>

        <div class="hud-group">
          <span>DAY</span>
          <strong id="day-value">1</strong>
          <span id="weather-value">맑음</span>
        </div>

        <div class="hud-group">
          <span id="time-value">08:00</span>

          <div class="time-track">
            <i id="time-fill"></i>
          </div>
        </div>

        <div class="hud-group stats">
          <span>
            RP
            <strong id="rp-value">0</strong>
          </span>

          <span>
            재료
            <strong id="material-value">0</strong>
          </span>
        </div>

        <div class="hud-group stamina">
          <span>체력</span>

          <div class="stamina-track">
            <i id="stamina-fill"></i>
          </div>

          <strong id="stamina-value">100</strong>
        </div>

      </header>

      <div class="game-layout">

        <!-- 왼쪽 퀘스트 창 -->
        <aside class="side-panel left pixel-panel">

          <h2>오늘의 연구</h2>
          <div id="quest-card"></div>

          <h2>일일 의뢰</h2>
          <div id="daily-card"></div>

          <div class="key-guide">
            <span>이동: WASD 또는 방향키</span>
            <span>조사: SPACE 또는 E</span>
            <span>달리기: SHIFT</span>
          </div>

        </aside>

        <!-- 게임 지도 -->
        <div id="canvas-wrap">

          <canvas
            id="game-canvas"
            width="768"
            height="432"
            aria-label="BIO LAB 연구소 지도"
          ></canvas>

          <div
            id="interaction-hint"
            class="interaction-hint hidden"
          >
            SPACE 조사
          </div>

          <div
            id="zone-banner"
            class="zone-banner hidden"
          ></div>

          <div
            id="toast"
            class="toast hidden"
            role="status"
          ></div>

        </div>

        <!-- 오른쪽 정보창 -->
        <aside class="side-panel right pixel-panel">

          <nav
            class="tab-buttons"
            aria-label="게임 메뉴"
          >
            <button
              class="tab active"
              data-tab="bag"
              type="button"
            >
              가방
            </button>

            <button
              class="tab"
              data-tab="people"
              type="button"
            >
              관계
            </button>

            <button
              class="tab"
              data-tab="lab"
              type="button"
            >
              연구
            </button>
          </nav>

          <div id="side-content"></div>

          <button
            id="save-btn"
            class="pixel-button small"
            type="button"
          >
            저장
          </button>

        </aside>

      </div>

      <!-- 아이패드 및 모바일 조작 버튼 -->
      <div
        id="mobile-controls"
        aria-label="모바일 조작"
      >

        <div class="dpad">

          <button
            data-key="ArrowUp"
            class="up"
            aria-label="위"
          >
            ▲
          </button>

          <button
            data-key="ArrowLeft"
            class="left"
            aria-label="왼쪽"
          >
            ◀
          </button>

          <button
            data-key="ArrowDown"
            class="down"
            aria-label="아래"
          >
            ▼
          </button>

          <button
            data-key="ArrowRight"
            class="right"
            aria-label="오른쪽"
          >
            ▶
          </button>

        </div>

        <button
          id="mobile-action"
          class="action-button"
          type="button"
        >
          조사
        </button>

      </div>

    </section>
  </main>

  <!-- 대화·퀴즈·실험창 -->
  <div
    id="modal"
    class="modal hidden"
    role="dialog"
    aria-modal="true"
    aria-labelledby="modal-title"
  >
    <div class="modal-card pixel-panel">

      <div class="modal-head">

        <h2 id="modal-title">대화</h2>

        <button
          id="modal-close"
          type="button"
          aria-label="닫기"
        >
          ×
        </button>

      </div>

      <div id="modal-content"></div>

    </div>
  </div>

  <!-- quest.js가 반드시 main.js보다 먼저 와야 합니다 -->
  <script src="quest.js"></script>
  <script src="main.js"></script>
</body>
</html>
